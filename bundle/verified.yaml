    one_liner: 信号可信 ⟺ 信号成本随类型系统性不同(单交叉)——找成本差; 解读行动=求PBE四件套(类型/策略/信念/反应)
    intents: [解读公司反常行动的信息含义, 判断信号可信性, 推演市场对公告的解读, 评估口头表态信息量]
