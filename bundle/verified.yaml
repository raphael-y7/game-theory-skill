schema_version: 1
bundle_id: bundle.game-theory-fudenberg-tirole
book:
  title: 博弈论(Game Theory)
  author: 朱·弗登博格(Drew Fudenberg)、让·梯若尔(Jean Tirole), 姚洋校, 黄涛等译
  source_pack: 人大2015版(诺贝尔经济学奖获得者丛书), ISBN 978-7-300-20993-7
  baseline_tag: investment-oriented-2026-10-28
entry:
  name: game-theory-skill
  description: 《博弈论》(弗登博格&梯若尔)能力总入口——把行业竞争、公司行为与市场共识问题化为可求解的博弈模型并给出可检验的判断。覆盖16个能力单元(7个已晋级独立入口+9个router能力卡), 收录338条三重验证通过的能力候选与94个原书例题/64个反例边界。当问题落在博弈论投资分析但不确定具体分支时由此进入, 按 intents/keywords 路由到对应能力卡; 每张卡的 B 段(边界)与 A1 段(书中例题)保证判断有出处、不越界。
  core_principles:
    - 预测对手行为靠建模找均衡, 不靠外生信念; 先数有效参与人、按时序×信息两维选均衡概念
    - 合作可持续 ⟺ 未来惩罚损失的贴现和 > 当期背离利得; 期限结构与信息结构与阈值同等重要
    - 信号可信 ⟺ 信号成本随类型系统性不同(单交叉); 威胁可信 ⟺ 兑现条件下执行仍是自身最优
    - 声誉价值 = 未来关系租金流 vs 欺骗一次的短期利得; 微小先验×长期限即可支撑威慑
    - 均衡常常多重, 预测输出区间+稳健度而非点位; 信息结构的微小差异可翻转结论
  out_of_scope:
    - 行为金融/投资者情绪建模(本书成书于行为博弈论兴起前, 理性假设需要外部修正)
    - 具体标的的估值定价(本包提供博弈结构判断, 不替代财务与估值分析)
    - 反垄断法律分析(现实合谋的法律维度需另行叠加)
  stop_conditions:
    - 无法还原博弈规则三要素(竞争变量/时序/信息)时停止, 先补齐建模材料
    - 收益参数(利润/成本/耐心)完全无法估计时只输出定性区间, 不做数值结论
    - 现实情形含本书不建模的维度(法律、行为偏差、多物品动态)时明确标注并建议叠加外部框架
router_entry:
  name: game-theory-skill-router
  description: "《博弈论》(弗登博格&梯若尔)全能力路由入口。覆盖16个能力单元: 晋级独立入口7个(合谋与价格战/信号解读/承诺与威慑/竞争格局/时机竞争/品牌与关系资产/声誉与强硬表态), router能力卡9个(行业博弈建模基础/监督与合作纪律/拍卖与竞价/议价与耐用品定价/机制反推与筛选定价/说真话与集体行动/多重均衡与共识/信息结构与共同知识/马尔可夫状态变量)。按 intents/keywords 路由; 338条verified候选全部可经能力卡到达, 每卡带原书例题(A1)与边界(B)。"
promotion_budget: 8
capabilities:
  # ============ 晋级 Skill(7个) ============
  - capability_id: cap.game-theory.collusion-price-war
    revision: 1
    status: active
    slug: collusion-price-war
    title: 合谋可持续性与价格战分析
    importance: critical
    importance_rationale: BOOK_OVERVIEW投资优先级task-01之首; 候选池最厚(50条verified, 覆盖第4/5章全部合谋机制); 12任务覆盖审计中task-01候选数第一; 价格战/提价持续性是行业分析最高频问题
    one_liner: 合作可持续 ⟺ 未来惩罚损失的贴现和 > 当期背离利得——用δ阈值、惩罚深度与期限结构三件事判断
    intents: [判断行业合谋可持续性, 预测价格战触发条件, 评估限产保价联盟稳定性, 解读价格战成因]
    keywords: [合谋, 卡特尔, 价格战, 默契配合, 涨价函, 限产保价, 行业自律, 临界贴现因子, 触发策略, collusion, price war, tacit coordination, cartel stability]
    also_read: [cap.game-theory.monitoring-cooperation-discipline, cap.game-theory.competition-pattern-comparative-statics, cap.game-theory.reputation-tough-talk, cap.game-theory.multiple-equilibria-consensus]
    card: cards/collusion-price-war.md
    frontmatter:
      description: >
        分析行业合谋/价格战可持续性时用; 输入行业价格行为、参与人耐心(δ)、监督结构, 输出合作可持续判断与价格战触发条件。不用: 单次竞争定价(用competition-pattern)、对消费者品牌承诺(用long-run-relationship-assets)。近邻分流: 近邻分流: 已知公共价格信号(如只见市价、Green-Porter型)→本卡触发价格分支; 需审计归因/满秩(信号不可分、谁在背离不可统计)→monitoring-cooperation-discipline; "合并/集中度提升后能否默契守价"归本卡(算δ阈值); 单次提价跟随的方向判断(交叉偏导)→competition-pattern。Trigger: 合谋、卡特尔、价格战、默契配合、涨价函、限产保价、collusion, price war, cartel。
      tags: [decision, game-theory, competition]
    source_evidence:
      - source_id: src-main-book
        location: 第4章4.2-4.4; 第5章5.1-5.7(定理5.1-5.11, 定理4.1/4.2/4.4)
    promotion:
      destination: promoted
      gate: {independent_intent: true, independent_contract: true, independent_run: true, independent_reuse: true, independent_eval: true}
      notes: 五判据全过, 排序第1(task-01之首, 候选最厚)
  - capability_id: cap.game-theory.signal-reading-pbe
    revision: 1
    status: active
